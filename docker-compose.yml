#
# La version de php se elige con PHP_VERSION (default 8.5), ej:
#   PHP_VERSION=8.2 docker-compose -p sdk-php8.2 run --rm app composer update
services:
  app:
    working_dir: /usr/src
    privileged: true
    volumes:
      - ./:/usr/src
    environment:
      HOME: /tmp
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    network_mode:  host
